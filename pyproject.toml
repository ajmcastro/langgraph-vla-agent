[project]
name = "langgraph-vla-agent"
version = "0.1.0"
description = "Agentic planning layer over a Vision-Language-Action (VLA) policy using LangGraph and SmolVLA"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antonio Castro", email = "frisky.antonio@gmail.com" }]
requires-python = ">=3.12"
keywords = ["robotics", "vla", "langgraph", "lerobot", "smolvla", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime deps — intentionally minimal.
# LeRobot (lerobot[smolvla,dataset]) and LangGraph are optional extras
# introduced in later milestones to keep the dev loop light on local machines.
dependencies = [
    "pydantic>=2.7.4",          # typed domain models and validated LLM outputs
    "structlog>=24.0.0",        # structured, correlated logging
    "numpy>=2.0.0,<2.3.0",     # array ops; upper bound mirrors LeRobot's constraint
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
]

# Milestone 5+: LangGraph orchestration layer.
# Provider-specific langchain packages (anthropic, openai, …) added by the user
# depending on which LLM backend they configure.
agent = [
    "langgraph>=1.2.0",
    "langchain-core>=1.4.7",
]

# Milestone 3+: SmolVLA adapter and dataset loading.
# On macOS/Apple Silicon: uses MPS backend; install system ffmpeg via `brew install ffmpeg`.
# On Linux with CUDA: override torch with `uv pip install --torch-backend cu128 lerobot`.
# Large download (~GB of model weights + dataset); requires cloud GPU for training.
vla = [
    "lerobot[smolvla,dataset]>=0.1.0",
]

# Convenience: everything a local developer needs without GPU deps.
all-dev = [
    "langgraph-vla-agent[dev,agent]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_vla_agent"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
    "ANN", # annotations
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # test functions don't need full annotation coverage

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast, no external deps (default CI gate)",
    "integration: may hit disk or network; excluded from strict unit gate",
    "simulation: requires a simulator (MuJoCo or similar)",
    "hardware: requires a physical robot; never run in CI",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_configs = true
# Third-party stubs are sparse for ML packages; silence missing-import errors
# for optional extras not installed in the dev environment.
# Overrides for optional extras not installed in the base dev environment.
# These become active when [vla] or [agent] extras are installed.
[[tool.mypy.overrides]]
module = ["lerobot.*", "torch.*", "langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
